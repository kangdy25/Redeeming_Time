services:
  - type: web
    name: redeeming-time-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: redeeming-time-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: redeeming-time-cache
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://redeeming-time.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://redeeming-time.vercel.app
      - key: FRONTEND_ORIGIN
        value: https://redeeming-time.vercel.app
      # Enter these in Render when creating a Blueprint. Existing services
      # retain their manually configured values on later Blueprint syncs.
      - key: SOCIAL_AUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: SOCIAL_AUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SOCIAL_AUTH_GOOGLE_REDIRECT_URI
        sync: false
      - key: SOCIAL_AUTH_KAKAO_CLIENT_ID
        sync: false
      - key: SOCIAL_AUTH_KAKAO_CLIENT_SECRET
        sync: false
      - key: SOCIAL_AUTH_KAKAO_REDIRECT_URI
        sync: false
      - key: NUM_PROXIES
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: PLANNER_TIME_ZONE
        value: Asia/Seoul

  - type: keyvalue
    name: redeeming-time-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: redeeming-time-db
    region: singapore
    plan: free
    databaseName: redeeming_time
    user: redeeming_time
