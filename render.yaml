services:
  - type: web
    name: redeeming-time-api
    runtime: docker
    region: singapore
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    preDeployCommand: uv run --no-sync manage.py migrate --noinput
    autoDeployTrigger: checksPass
    numInstances: 1
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: redeeming-time-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: redeeming-time-cache
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://redeeming-time.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://redeeming-time.vercel.app
      - key: NUM_PROXIES
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_CONN_MAX_AGE
        value: "60"

  - type: keyvalue
    name: redeeming-time-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: redeeming-time-db
    region: singapore
    plan: basic-256mb
    databaseName: redeeming_time
    user: redeeming_time
