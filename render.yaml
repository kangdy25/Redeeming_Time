services:
  - type: web
    name: redeeming-time-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Set this manually in Render to Neon's pooled connection URL. It stays
      # out of source control and is intentionally preserved across syncs.
      - key: DATABASE_URL
        sync: false
      # Set this manually to Neon's direct connection URL. The container uses
      # it only for Django migrations, then runs Gunicorn with DATABASE_URL.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: redeeming-time-cache
          property: connectionString
      - key: ALLOWED_HOSTS
        # Requests proxied through Vercel preserve the public frontend host.
        value: .onrender.com,redeeming-time.vercel.app
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://redeeming-time.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://redeeming-time.vercel.app
      - key: FRONTEND_ORIGIN
        value: https://redeeming-time.vercel.app
      # Enter these in Render when creating a Blueprint. Existing services
      # retain their manually configured values on later Blueprint syncs.
      - key: SOCIAL_AUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: SOCIAL_AUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SOCIAL_AUTH_GOOGLE_REDIRECT_URI
        sync: false
      - key: SOCIAL_AUTH_KAKAO_CLIENT_ID
        sync: false
      - key: SOCIAL_AUTH_KAKAO_CLIENT_SECRET
        sync: false
      - key: SOCIAL_AUTH_KAKAO_REDIRECT_URI
        sync: false
      # Enable only after configuring a transactional SMTP provider in Render.
      - key: PASSWORD_RESET_EMAIL_ENABLED
        sync: false
      - key: EMAIL_VERIFICATION_ENABLED
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: NUM_PROXIES
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: PLANNER_TIME_ZONE
        value: Asia/Seoul

  - type: keyvalue
    name: redeeming-time-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
